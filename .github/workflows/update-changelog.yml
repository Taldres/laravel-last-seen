name: update changelog

on:
  release:
    types: [released]

permissions: {}

jobs:
  update:
    name: Update changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      # Pushes the changelog branch and opens the pull request.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Update changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      # main requires passing checks, which a push by this workflow cannot
      # have, so the changelog goes through a pull request that a maintainer
      # merges (checks do not run on pull requests opened with GITHUB_TOKEN).
      - name: Open a pull request with the updated changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BASE: ${{ github.event.release.target_commitish }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "The changelog is up to date."
            exit 0
          fi
          branch="changelog/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --message "docs: update the changelog for ${TAG}" -- CHANGELOG.md
          git push --force origin "$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "docs: update the changelog for ${TAG}" \
            --body "Generated from the release notes of ${TAG}."
