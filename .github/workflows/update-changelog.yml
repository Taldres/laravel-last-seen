name: update changelog

on:
  release:
    types: [released]

permissions: {}

jobs:
  update:
    name: Update changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      # Allows the job to push the changelog branch.
      contents: write
      # Allows the job to open the changelog pull request.
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Update changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      # The release branch only accepts pull requests, so the changelog goes
      # through one too.
      - name: Open changelog pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BASE: ${{ github.event.release.target_commitish }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          branch="docs/changelog-${TAG//./-}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "${branch}"
          git commit --message "docs: update the changelog for ${TAG}" -- CHANGELOG.md
          git push origin "${branch}"

          gh pr create \
            --base "${BASE}" \
            --head "${branch}" \
            --label skip-changelog \
            --title "docs: update the changelog for ${TAG}" \
            --body "Adds the release notes of ${TAG} to CHANGELOG.md."
